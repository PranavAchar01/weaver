[project]
name = "weaver"
version = "0.1.0"
description = "Continuous remediation built on Semgrep: Semgrep finds it, Weaver mends it."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "flask",
    "pyyaml",
    "pytest",
    "playwright",
    "boto3>=1.43.111",
]

[project.scripts]
weaver = "weaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weaver"]
